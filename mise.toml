# Optional task runner for contributors who use mise (https://mise.jdx.dev).
# `mise tasks` lists them; npm in build/ works the same without mise.
[tools]
node = "24"

[tasks.install]
description = "Install the build's dependencies"
dir = "build"
run = "npm ci"

[tasks.build]
description = "Build editor/ and THIRD_PARTY_NOTICES.txt"
dir = "build"
run = "npm run build"

[tasks.test]
description = "Run the unit tests"
dir = "build"
run = "npm test"

[tasks.typecheck]
description = "Type-check the sources and tests"
dir = "build"
run = "npm run typecheck"
