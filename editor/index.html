<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>3D Viewer</title>
<style>
/* The viewer opens light and the toolbar switches it to dark; both use Orca's own colours. */
:root {
  --bg: #ffffff;
  --fg: #0a0a0a;
  --muted-fg: #737373;
  --muted: #f5f5f5;
  --accent: #f5f5f5;
  --accent-fg: #171717;
  --border: #e5e5e5;
  --input: #e5e5e5;
  --ring: #a1a1a1;
  --radius: var(--orca-radius, 6px);
  --ui-font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color-scheme: light;
}
:root.dark {
  --bg: #0a0a0a;
  --fg: #fafafa;
  --muted-fg: #a1a1a1;
  --muted: #262626;
  --accent: #404040;
  --accent-fg: #fafafa;
  --border: rgb(255 255 255 / 0.07);
  --input: rgb(255 255 255 / 0.15);
  --ring: #737373;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--fg); font: 12px/1.4 var(--ui-font); }
[hidden] { display: none !important; }
button, select { font: inherit; color: inherit; }

#app { display: flex; flex-direction: column; height: 100%; }
.stage { position: relative; flex: 1; min-height: 0; }
.viewport { position: absolute; inset: 0; }
.overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 32px; color: var(--muted-fg); text-align: center; font-size: 13px; }
.overlay p { margin: 0; max-width: 480px; }
.overlay-icon:empty { display: none; }
.notice { max-height: 4.5em; overflow-y: auto; padding: 5px 12px; border-top: 1px solid var(--border); background: var(--muted); color: var(--muted-fg); overflow-wrap: anywhere; }
.viewport canvas:focus-visible { outline: 2px solid var(--ring); outline-offset: -2px; }

.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; padding: 6px 16px; border-top: 1px solid var(--border); color: var(--muted-fg); white-space: nowrap; }
.group { display: flex; flex: none; align-items: center; gap: 4px; }
.tool { display: inline-flex; align-items: center; justify-content: center; padding: 4px; border: 0; border-radius: calc(var(--radius) - 2px); background: none; cursor: default; }
.tool:hover:not(:disabled), .tool[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.tool:focus-visible { outline: 1px solid var(--ring); outline-offset: -1px; }
.tool:disabled { opacity: 0.5; }
.select { max-width: 160px; height: 24px; padding: 0 6px; border: 1px solid var(--input); border-radius: var(--radius); background: var(--bg); }
.select:focus { outline: none; border-color: var(--ring); }
.clip-name { max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
.figure { flex: none; font-variant-numeric: tabular-nums; }
.pending { margin-left: auto; font-style: italic; }
</style>
<script type="module" src="./assets/main-UKXZIGI4.js"></script>
</head>
<body>
<div id="app"></div>
</body>
</html>
