version: 2
updates:
  - package-ecosystem: npm
    directory: /build
    schedule:
      interval: weekly
    # Why: a release gets two weeks to be caught and yanked before it lands here.
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      three:
        patterns: ["three", "@types/three"]
      gltf-transform:
        patterns: ["@gltf-transform/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    labels:
      - ci
