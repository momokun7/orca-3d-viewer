name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Orca release whose validator checks the manifest (v1.4.250). Bump it deliberately.
  ORCA_REF: b98a0fba16561fadc06868fe3e8710781d705efd

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # list the pull request's files
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      # Why: prose and images give the build and test jobs nothing to check; the security audit
      # still runs, since personal details slip into prose first.
      - name: Does the pull request change more than prose and images?
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files="$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')"
          echo "$files"
          if echo "$files" | grep -qvE '^(docs/.*|[^/]+\.md)$'; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Why: macOS and Windows minutes cost several times Linux's, so pull requests run Linux only
        # and main runs all three.
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden Runner
        if: matrix.os == 'ubuntu-latest'
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Why no install scripts: nothing here needs one, and a compromised dependency's would run first.
      - name: Install dependencies
        working-directory: build
        run: npm ci --ignore-scripts
      - name: Type-check
        working-directory: build
        run: npm run typecheck
      - name: Unit tests
        working-directory: build
        env:
          # Why fixed: a failure on a pull request must reproduce; the weekly fuzz run picks new seeds.
          FUZZ_SEED: "20261106"
        run: npm test
      - name: Build
        working-directory: build
        run: npm run build
      # The committed editor/ is what Orca installs: it must be exactly what these sources build,
      # with no file changed, removed, or added beside it.
      - name: Check the committed build is reproducible
        shell: bash
        run: |
          changes="$(git status --porcelain --untracked-files=all -- editor THIRD_PARTY_NOTICES.txt)"
          if [ -n "$changes" ]; then
            echo "The build differs from the committed editor/:"
            echo "$changes"
            git diff --stat -- editor THIRD_PARTY_NOTICES.txt
            exit 1
          fi

  browser:
    name: Browser security tests (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Why shards: each test file starts its own Chromium, so three runners finish in a third of the time.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: build
        run: npm ci --ignore-scripts
      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('build/package-lock.json') }}
      - name: Install Chromium
        working-directory: build
        run: npx playwright-core install --with-deps chromium
      # Runs the committed editor/, the bytes Orca would install.
      - name: Browser tests (Orca frame CSP, no network, hostile models)
        working-directory: build
        env:
          FUZZ_SEED: "20261106"
          SHARD: ${{ matrix.shard }}
        run: node --test --test-shard="$SHARD/3" test/browser/*.browser.test.ts

  validate:
    name: Orca plugin validation
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: plugin
          persist-credentials: false
      - name: Check out Orca
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: stablyai/orca
          ref: ${{ env.ORCA_REF }}
          path: orca
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: orca/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Why no install scripts: the validator needs only Orca's JavaScript, not Electron.
      - name: Install Orca's validator
        working-directory: orca
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build:packages
      - name: Validate the plugin
        working-directory: orca
        run: pnpm validate:plugin "$GITHUB_WORKSPACE/plugin"

  security:
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the full history
      pull-requests: read # gitleaks lists a pull request's commits to scan them
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Gitleaks (secret scan of the full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Why: artifacts of a public repository are public; findings show in the log instead.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Personal details and private words in tracked files
        env:
          SENSITIVE_WORDS: ${{ secrets.SENSITIVE_WORDS }}
        run: node tools/check-sensitive.ts files
      - name: Personal details and private words in commit messages and authors
        env:
          SENSITIVE_WORDS: ${{ secrets.SENSITIVE_WORDS }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        # Why the merge base when BASE is gone: a force push leaves the old head unreachable.
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE="$(git merge-base origin/main "$HEAD")"; fi
          node tools/check-sensitive.ts commits "$BASE" "$HEAD"
      # Squash merges turn these into the commit message on main.
      - name: Personal details and private words in the pull request title and body
        if: github.event_name == 'pull_request'
        env:
          SENSITIVE_WORDS: ${{ secrets.SENSITIVE_WORDS }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node tools/check-sensitive.ts env PR_TITLE PR_BODY
      - name: Install dependencies
        working-directory: build
        run: npm ci --ignore-scripts
      - name: npm audit (known vulnerabilities)
        working-directory: build
        run: npm audit --audit-level=low
      - name: npm audit signatures (registry signatures and provenance)
        working-directory: build
        run: npm audit signatures
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: build
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 1

  workflows:
    name: Workflow audit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor (GitHub Actions security lints)
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          persona: pedantic
          # Why: code scanning needs a public repository; print findings and fail instead.
          advanced-security: false

  # The one check the main ruleset requires: jobs skipped for a prose-only change count as passing.
  result:
    name: CI result
    needs: [changes, test, browser, validate, security, workflows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
