name: Fuzz

on:
  schedule:
    - cron: "0 3 * * 1" # Every Monday at 03:00 UTC
  workflow_dispatch: # run on demand, e.g. after a three.js update

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: Fuzz (long run)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: build
        run: npm ci --ignore-scripts
      - name: Install Chromium
        working-directory: build
        run: npx playwright-core install --with-deps chromium
      - name: Property tests (parsers, budget and URL policy)
        working-directory: build
        env:
          FUZZ_RUNS: "50000"
          ORACLE_RUNS: "2000"
        run: npm test
      - name: Browser fuzzing (corrupted and random models in the sandboxed frame)
        working-directory: build
        env:
          FUZZ_RUNS: "1500"
        run: npm run test:browser

  platforms:
    name: Browser tests (${{ matrix.os }}, native graphics backend)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: build
        run: npm ci --ignore-scripts
      - name: Install Chromium
        working-directory: build
        run: npx playwright-core install chromium
      # Context loss, precision and limits differ between ANGLE's D3D11 and Metal backends.
      - name: Browser tests on the platform's ANGLE backend
        working-directory: build
        env:
          ORCA_TEST_ANGLE: native
        run: npm run test:browser
